name: Update GCP EDL

on:
 schedule:
   - cron: "0 8 * * *"   # every Sunday
 workflow_dispatch:

jobs:
 update-edl:
   runs-on: ubuntu-latest

   steps:
     - name: Checkout
       uses: actions/checkout@v4

     - name: Setup Python
       uses: actions/setup-python@v5
       with:
         python-version: '3.x'

     - name: Install requests
       run: pip install requests

     - name: Run script
       run: python update_edl.py

     - name: Commit file
       run: |
         git config user.name "github-actions"
         git config user.email "actions@github.com"
         git add gcp_edl.txt
         git diff --quiet && git diff --staged --quiet || git commit -m "Update EDL"
         git push
